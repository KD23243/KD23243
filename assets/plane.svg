    <g transform="translate(0 24)"><g class="bob">
      <g class="flap">
        <path d="M150 22 L470 16 L482 40 L470 64 L150 58 Q140 40 150 22 Z" fill="#ffeb3b" stroke="#111" stroke-width="2.5"/>
