        <rect x="133" y="30" width="4" height="28" rx="2" fill="#111">
          <animate attributeName="height" values="28;4;28" dur="0.15s" repeatCount="indefinite"/>
          <animate attributeName="y" values="30;42;30" dur="0.15s" repeatCount="indefinite"/>
