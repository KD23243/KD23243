        <path d="M16 34 L4 12 L22 12 L38 34 Z" fill="#ff3b3b" stroke="#111" stroke-width="2.5"/>
        <path d="M60 46 L76 80 L94 80 L88 48 Z" fill="#c62828" stroke="#111" stroke-width="2.5"/>
