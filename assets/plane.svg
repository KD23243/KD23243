<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" width="900" height="230">
  <style>
    .fly { animation: fly 8s linear infinite; }
    .bob { animation: bob 0.8s ease-in-out infinite alternate; }
    .flap { animation: flap 0.35s ease-in-out infinite alternate; transform-origin: 0 64px; transform-box: view-box; }
    .run { animation: run 0.3s ease-in-out infinite alternate; }
    .legA, .legB, .armB { transform-box: fill-box; transform-origin: 50% 0; }
    .legA { animation: swing 0.3s ease-in-out infinite alternate; }
    .legB { animation: swing 0.3s ease-in-out infinite alternate-reverse; }
    .armB { animation: swing 0.3s ease-in-out infinite alternate-reverse; }
    .fist { transform-box: fill-box; transform-origin: 0% 100%; animation: shake 0.15s ease-in-out infinite alternate; }
    .scarf { transform-box: fill-box; transform-origin: 100% 50%; animation: scarf 0.2s ease-in-out infinite alternate; }
    @keyframes fly { from { transform: translateX(-680px); } to { transform: translateX(960px); } }
    @keyframes bob { from { transform: translateY(-4px); } to { transform: translateY(4px); } }
    @keyframes flap { from { transform: skewY(-3deg); } to { transform: skewY(3deg); } }
    @keyframes run { from { transform: translateY(0); } to { transform: translateY(-8px); } }
    @keyframes swing { from { transform: rotate(-32deg); } to { transform: rotate(32deg); } }
    @keyframes shake { from { transform: rotate(-12deg); } to { transform: rotate(10deg); } }
    @keyframes scarf { from { transform: skewY(-12deg); } to { transform: skewY(12deg); } }
    text { font-family: "Comic Sans MS", "Comic Neue", "Chalkboard SE", cursive; font-weight: 700; }
  </style>
  <rect width="900" height="230" fill="#7ec8ff"/>
  <g fill="#fff" opacity="0.9"><ellipse cx="120" cy="40" rx="40" ry="14"/><ellipse cx="145" cy="32" rx="26" ry="14"/><ellipse cx="480" cy="110" rx="46" ry="15"/><ellipse cx="505" cy="100" rx="28" ry="14"/><ellipse cx="780" cy="50" rx="38" ry="13"/><ellipse cx="800" cy="42" rx="24" ry="12"/></g>
    <g transform="translate(40 214) scale(1.0)"><rect x="-5" y="-30" width="10" height="30" fill="#6d4c2f" stroke="#111" stroke-width="1.5"/><circle cx="0" cy="-44" r="20" fill="#2e9e3a" stroke="#111" stroke-width="2"/><circle cx="-12" cy="-34" r="13" fill="#38b347" stroke="#111" stroke-width="2"/><circle cx="12" cy="-34" r="13" fill="#38b347" stroke="#111" stroke-width="2"/></g>
    <g transform="translate(150 214) scale(0.8)"><rect x="-5" y="-30" width="10" height="30" fill="#6d4c2f" stroke="#111" stroke-width="1.5"/><circle cx="0" cy="-44" r="20" fill="#2e9e3a" stroke="#111" stroke-width="2"/><circle cx="-12" cy="-34" r="13" fill="#38b347" stroke="#111" stroke-width="2"/><circle cx="12" cy="-34" r="13" fill="#38b347" stroke="#111" stroke-width="2"/></g>
    <g transform="translate(270 214) scale(1.15)"><rect x="-5" y="-30" width="10" height="30" fill="#6d4c2f" stroke="#111" stroke-width="1.5"/><circle cx="0" cy="-44" r="20" fill="#2e9e3a" stroke="#111" stroke-width="2"/><circle cx="-12" cy="-34" r="13" fill="#38b347" stroke="#111" stroke-width="2"/><circle cx="12" cy="-34" r="13" fill="#38b347" stroke="#111" stroke-width="2"/></g>
    <g transform="translate(390 214) scale(0.9)"><rect x="-5" y="-30" width="10" height="30" fill="#6d4c2f" stroke="#111" stroke-width="1.5"/><circle cx="0" cy="-44" r="20" fill="#2e9e3a" stroke="#111" stroke-width="2"/><circle cx="-12" cy="-34" r="13" fill="#38b347" stroke="#111" stroke-width="2"/><circle cx="12" cy="-34" r="13" fill="#38b347" stroke="#111" stroke-width="2"/></g>
    <g transform="translate(520 214) scale(1.05)"><rect x="-5" y="-30" width="10" height="30" fill="#6d4c2f" stroke="#111" stroke-width="1.5"/><circle cx="0" cy="-44" r="20" fill="#2e9e3a" stroke="#111" stroke-width="2"/><circle cx="-12" cy="-34" r="13" fill="#38b347" stroke="#111" stroke-width="2"/><circle cx="12" cy="-34" r="13" fill="#38b347" stroke="#111" stroke-width="2"/></g>
    <g transform="translate(640 214) scale(0.85)"><rect x="-5" y="-30" width="10" height="30" fill="#6d4c2f" stroke="#111" stroke-width="1.5"/><circle cx="0" cy="-44" r="20" fill="#2e9e3a" stroke="#111" stroke-width="2"/><circle cx="-12" cy="-34" r="13" fill="#38b347" stroke="#111" stroke-width="2"/><circle cx="12" cy="-34" r="13" fill="#38b347" stroke="#111" stroke-width="2"/></g>
    <g transform="translate(760 214) scale(1.1)"><rect x="-5" y="-30" width="10" height="30" fill="#6d4c2f" stroke="#111" stroke-width="1.5"/><circle cx="0" cy="-44" r="20" fill="#2e9e3a" stroke="#111" stroke-width="2"/><circle cx="-12" cy="-34" r="13" fill="#38b347" stroke="#111" stroke-width="2"/><circle cx="12" cy="-34" r="13" fill="#38b347" stroke="#111" stroke-width="2"/></g>
    <g transform="translate(860 214) scale(0.9)"><rect x="-5" y="-30" width="10" height="30" fill="#6d4c2f" stroke="#111" stroke-width="1.5"/><circle cx="0" cy="-44" r="20" fill="#2e9e3a" stroke="#111" stroke-width="2"/><circle cx="-12" cy="-34" r="13" fill="#38b347" stroke="#111" stroke-width="2"/><circle cx="12" cy="-34" r="13" fill="#38b347" stroke="#111" stroke-width="2"/></g>
  <rect y="212" width="900" height="18" fill="#8b5a2b"/>
  <rect y="210" width="900" height="4" fill="#5c3a1a"/>
