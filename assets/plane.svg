<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 120" width="900" height="120">
  <style>
    .fly { animation: fly 7s linear infinite; }
    .bob { animation: bob 0.8s ease-in-out infinite alternate; }
    .flap { animation: flap 0.35s ease-in-out infinite alternate; transform-origin: 0 50px; transform-box: view-box; }
    @keyframes fly { from { transform: translateX(-620px); } to { transform: translateX(960px); } }
    @keyframes bob { from { transform: translateY(-4px); } to { transform: translateY(4px); } }
    @keyframes flap { from { transform: skewY(-3deg); } to { transform: skewY(3deg); } }
    text { font-family: "Comic Sans MS", "Comic Neue", "Chalkboard SE", cursive; font-weight: 700; }
  </style>
  <g class="fly">
    <g class="bob">
      <!-- banner -->
      <g class="flap">
        <path d="M0 32 L440 26 L452 50 L440 74 L0 68 Q-10 50 0 32 Z" fill="#ffeb3b" stroke="#111" stroke-width="2.5"/>
        <text x="220" y="58" font-size="22" fill="#e00" text-anchor="middle" textLength="410" lengthAdjust="spacingAndGlyphs">PUSHED TO MAIN. NO REVIEW. IT WORKED. ✌️</text>
      </g>
      <!-- tow rope -->
      <path d="M452 50 Q480 46 505 52" fill="none" stroke="#111" stroke-width="2" stroke-dasharray="4 3"/>
      <!-- plane -->
      <g transform="translate(505 20)">
        <path d="M0 32 Q4 22 20 22 L80 20 Q100 20 108 30 Q100 40 80 40 L20 40 Q4 40 0 32 Z" fill="#ff3b3b" stroke="#111" stroke-width="2.5"/>
        <path d="M14 22 L4 4 L18 4 L32 22 Z" fill="#ff3b3b" stroke="#111" stroke-width="2.5"/>
        <path d="M42 30 L58 0 L72 0 L66 30 Z" fill="#c62828" stroke="#111" stroke-width="2.5"/>
        <path d="M44 34 L56 60 L70 60 L66 36 Z" fill="#c62828" stroke="#111" stroke-width="2.5"/>
        <circle cx="86" cy="28" r="5" fill="#9be7ff" stroke="#111" stroke-width="2"/>
        <rect x="107" y="18" width="4" height="24" rx="2" fill="#111">
          <animate attributeName="height" values="24;4;24" dur="0.15s" repeatCount="indefinite"/>
          <animate attributeName="y" values="18;28;18" dur="0.15s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>
  </g>
</svg>
