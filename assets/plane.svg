        <path d="M44 8 L54 0 L54 14 Z" fill="#ff8fc8" stroke="#111" stroke-width="2"/>
        <circle cx="42" cy="22" r="15" fill="#ff9ed2" stroke="#111" stroke-width="2.5"/>
        <rect x="30" y="12" width="26" height="8" rx="4" fill="#5b3a1a" stroke="#111" stroke-width="1.5"/>
        <circle cx="38" cy="16" r="4" fill="#9be7ff" stroke="#111" stroke-width="1.5"/>
        <circle cx="49" cy="16" r="4" fill="#9be7ff" stroke="#111" stroke-width="1.5"/>
        <ellipse cx="54" cy="26" rx="7" ry="5.5" fill="#ff6fb5" stroke="#111" stroke-width="2"/>
        <circle cx="52" cy="26" r="1.4" fill="#111"/>
        <circle cx="56.5" cy="26" r="1.4" fill="#111"/>
